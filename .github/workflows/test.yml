name: Test

on:
  # Doc-only PRs skip every heavy workflow (see docs/ci-parity.md).
  # Cargo.toml / Cargo.lock changes (which COULD be hidden dep edits)
  # are intentionally NOT in paths-ignore — they always trigger Test.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "CHANGELOG.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "CHANGELOG.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Install VPN tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y wireguard-tools openvpn golang-go libmnl-dev pkg-config
      - name: Install VPN tools (macOS)
        if: runner.os == 'macOS'
        run: brew install wireguard-tools openvpn go bash
      - name: Install AmneziaWG tools
        run: |
          git clone --depth 1 --branch v3.1.20260812 https://github.com/amnezia-vpn/amneziawg-tools /tmp/awg-tools
          (cd /tmp/awg-tools/src && make && sudo make PREFIX=/usr/local WITH_WGQUICK=yes install)
          git clone --depth 1 --branch v3.1.20260828 https://github.com/amnezia-vpn/amneziawg-go /tmp/awg-go
          (cd /tmp/awg-go && go build -o amneziawg-go && sudo cp amneziawg-go /usr/local/bin/)
          awg show all dump  # smoke: the observation path vortix shells out to
      - run: cargo test --workspace

  test-fedora:
    name: Test (fedora-41)
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Bootstrap Fedora container
        run: |
          dnf install -y ca-certificates curl gcc gcc-c++ git make nftables openvpn pkgconf-pkg-config procps-ng shadow-utils which wireguard-tools golang libmnl-devel
          useradd -m tester
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@v2
      - name: Prepare tester workspace and Rust toolchain
        run: |
          chown -R tester:tester "$GITHUB_WORKSPACE"
          cp -a "$HOME/.cargo" /home/tester/
          cp -a "$HOME/.rustup" /home/tester/
          chown -R tester:tester /home/tester/.cargo /home/tester/.rustup
      - name: Install AmneziaWG tools
        run: |
          git clone --depth 1 --branch v3.1.20260812 https://github.com/amnezia-vpn/amneziawg-tools /tmp/awg-tools
          (cd /tmp/awg-tools/src && make && make PREFIX=/usr/local WITH_WGQUICK=yes install)
          git clone --depth 1 --branch v3.1.20260828 https://github.com/amnezia-vpn/amneziawg-go /tmp/awg-go
          (cd /tmp/awg-go && go build -o amneziawg-go && cp amneziawg-go /usr/local/bin/)
          chmod -R a+rX /usr/local/bin/awg /usr/local/bin/awg-quick /usr/local/bin/amneziawg-go
      - run: su - tester -c "cd \"$GITHUB_WORKSPACE\" && source \"\$HOME/.cargo/env\" && cargo test --workspace"
